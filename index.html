      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

      } catch (err) {

        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

        s.textContent = await r.text();
        s.removeAttribute('src');

      old.replaceWith(s);

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

radius:5px; background:#E3ECEB; overflow:hidden; margin-top:7px;\"><div style=\"{{ dCulturaBar }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:{{ dWhyBg }}; border-radius:14px; padding:16px 17px; margin-bottom:18px;\">\n            <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:7px;\">\n              <span style=\"font-size:15px;\">💡<\u002Fspan><span style=\"font-weight:800; font-size:13px; color:#22403F;\">¿Por qué está aquí?<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#3A5250; line-height:1.6;\">{{ dWhy }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:{{ dActionColor }}; line-height:1.55; margin-top:9px; font-weight:800;\">{{ dAction }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ dIsEval }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px;\">\n              <div>\n                <div style=\"font-weight:800; font-size:12.5px; color:#0C5C53; margin-bottom:11px;\">Uso por módulo<\u002Fdiv>\n                <sc-if value=\"{{ dHasUsoDetail }}\" hint-placeholder-val=\"{{ true }}\">\n                  <sc-for list=\"{{ dUsoDetail }}\" as=\"m\" hint-placeholder-count=\"6\">\n                    <div style=\"margin-bottom:9px;\">\n                      <div style=\"display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-bottom:3px;\"><span style=\"color:#3A5250; font-weight:600;\">{{ m.label }}<\u002Fspan><span style=\"color:#1B3A38; font-weight:800;\">{{ m.scoreTxt }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"height:6px; border-radius:4px; background:#EDF3F2; overflow:hidden;\"><div style=\"{{ m.bar }}\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ dNoUsoDetail }}\" hint-placeholder-val=\"{{ f ems:center; gap:12px; background:#F8FBFA; border:1px solid #EDF3F2; border-radius:11px; padding:11px 14px;\">\n                  <span style=\"{{ s.dot }}\"><\u002Fspan>\n                  <span style=\"font-weight:800; font-size:13px; color:#0C5C53; width:96px;\">{{ s.system }}<\u002Fspan>\n                  <span style=\"font-size:12px; color:#5B7173; font-weight:600;\">Uso <strong style=\"color:#1B3A38;\">{{ s.usoTxt }}<\u002Fstrong><\u002Fspan>\n                  <span style=\"font-size:12px; color:#5B7173; font-weight:600;\">Cultura <strong style=\"color:#1B3A38;\">{{ s.culturaTxt }}<\u002Fstrong><\u002Fspan>\n                  <span style=\"margin-left:auto; {{ s.quadStyle }}\">{{ s.quadLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ dShowEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:15px 26px; border-top:1px solid #EDF3F2; display:flex; gap:10px; justify-content:flex-end; position:sticky; bottom:0; background:#fff;\">\n            <button onclick=\"{{ closeDetail }}\" style=\"background:#fff; color:#5B7173; border:1px solid #D3E0DF; border-radius:10px; padding:11px 17px; font-weight:700; font-size:13.5px; cursor:pointer;\">Cerrar<\u002Fbutton>\n            <button onclick=\"{{ dEdit }}\" style=\"background:#15A795; color:#06231f; border:none; border-radius:10px; padding:11px 18px; font-weight:800; font-size:13.5px; cursor:pointer;\">{{ dEditLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeSettings }}\" style=\"position:fixed; inset:0; background:rgba(8,30,32,.52); z-index:70; display:flex; align-items:center; justify-content:center; padding:28px;\">\n      <div onclick=\"{{ stopProp }}\" style=\"width:560px; max-width:100%; background:#fff; border-radius:20px; box-shadow:0 26px 70px rgba(8,30,32,.34); overflow:hidden;\">\n        <div style=\"padding:22px 26px; border-bottom:1px solid #EDF3F2; display:flex; align-items:center; justify-content:space-between;\">\n          <div style=\"display:flex; align-items:center; gap:11px;\">\n            <span style=\"width:34px; height:34px; border-radius:9px; background:#E2F3EF; display:flex; align-items:center; justify-content:center; font-size:17px;\">🔗<\u002Fspan>\n            <div>\n              <h2 style=\"margin:0; font-family:'Poppins','Mulish',sans-serif; font-size:18px; font-weight:600; color:#0C2E32;\">Conectar Google Sheets<\u002Fh2>\n              <div style=\"font-size:12px; color:#7A908D; font-weight:600;\">Sincronización en doble vía con tu hoja<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeSettings }}\" style=\"border:none; background:#F4F8F8; width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:16px; color:#5B7173;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:22px 26px;\">\n          <label style=\"display:block; font-size:11.5px; font-weight:800; color:#5B7173; margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;\">URL de la aplicación web (termina en /exec)<\u002Flabel>\n          <input value=\"{{ urlDraft }}\" oninput=\"{{ setUrlDraft }}\" placeholder=\"https://script.google.com/macros/s/AKfy…/exec\" style=\"width:100%; padding:11px 13px; border:1px solid #D3E0DF; border-radius:10px; font-size:13px; color:#1B3A38; outline:none; font-family:'Mulish';\">\n          <sc-if value=\"{{ syncMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px; display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;\"><span style=\"{{ syncDotStyle }}\"><\u002Fspan><span style=\"{{ syncLabelStyle }}\">{{ syncMsg }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;\">\n            <button onclick=\"{{ doConnect }}\" style=\"background:#15A795; color:#06231f; border:none; border-radius:10px; padding:11px 18px; font-weight:800; font-size:13.5px; cursor:pointer;\">Conectar<\u002Fbutton>\n            <button onclick=\"{{ doPushAll }}\" style=\"background:#fff; color:#0C5C53; border:1px solid #BFE0D9; border-radius:10px; padding:11px 16px; font-weight:700; font-size:13.5px; cursor:pointer;\">⬆ Subir datos actuales<\u002Fbutton>\n            <sc-if value=\"{{ syncOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ doDisconnect }}\" style=\"background:#fff; color:#C24B49; border:1px solid #F1D9D8; border-radius:10px; padding:11px 16px; font-weight:700; font-size:13.5px; cursor:pointer; margin-left:auto;\">Desconectar<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px; padding-top:18px; border-top:1px dashed #DCE7E5;\">\n            <label style=\"display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; color:#5B7173; margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;\">🔑 Clave de equipo (para guardar cambios)<\u002Flabel>\n            <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n              <input value=\"{{ keyDraft }}\" oninput=\"{{ setKeyDraft }}\" type=\"password\" placeholder=\"Escribe la clave compartida del equipo\" style=\"flex:1; min-width:220px; padding:11px 13px; border:1px solid #D3E0DF; border-radius:10px; font-size:13px; color:#1B3A38; outline:none; font-family:'Mulish';\">\n              <button onclick=\"{{ doSaveKey }}\" style=\"background:#0C5C53; color:#fff; border:none; border-radius:10px; padding:11px 18px; font-weight:800; font-size:13.5px; cursor:pointer;\">Guardar clave<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px; display:flex; align-items:center; gap:7px;\"><span style=\"{{ syncDotStyle }}\"><\u002Fspan><span style=\"{{ keyStatusStyle }}\">{{ keyStatusTxt }}<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:11.5px; color:#7A908D; line-height:1.6;\">Quien tenga esta clave puede <strong>escribir<\u002Fstrong> en la hoja. Sin clave, el entorno <strong>solo lee<\u002Fstrong>. Compártela únicamente con los consultores que capturan datos; los gerentes no la necesitan.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px; background:#F8FBFA; border:1px solid #EDF3F2; border-radius:12px; padding:15px 16px;\">\n            <div style=\"font-weight:800; font-size:12.5px; color:#0C5C53; margin-bottom:8px;\">Cómo obtener la URL (una sola vez)<\u002Fdiv>\n            <ol style=\"margin:0; padding-left:18px; font-size:12.5px; color:#5B7173; line-height:1.75;\">\n              <li>En tu Google Sheet: <strong>Extensiones → Apps Script<\u002Fstrong>.<\u002Fli>\n              <li>Pega el código del archivo <strong>Codigo.gs<\u002Fstrong> que te entregué y guarda.<\u002Fli>\n              <li><strong>Implementar → Nueva implementación → Aplicación web<\u002Fstrong>.<\u002Fli>\n              <li>Acceso: <strong>Cualquier persona<\u002Fstrong>. Implementar y autorizar.<\u002Fli>\n              <li>Copia la <strong>URL<\u002Fstrong> (termina en <strong>/exec<\u002Fstrong>) y pégala arriba.<\u002Fli>\n              <li>Pulsa <strong>Conectar<\u002Fstrong> y luego <strong>Subir datos actuales<\u002Fstrong> una vez.<\u002Fli>\n            <\u002Fol>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px; font-size:11.5px; color:#7A908D; line-height:1.6;\">Para los <strong>gerentes (solo consulta)<\u002Fstrong>: comparte la misma URL del entorno publicado añadiendo <strong>?modo=consulta<\u002Fstrong> al final. Verán el mapa sin botones de edición.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    const OPTS = [{label:'No',v:1},{label:'Parcial',v:3},{label:'SI',v:5},{label:'N/A',v:'NA'}];\n    this.usoModules = [\n      {key:'procesos', label:'Procesos', questions:[\n        {key:'estructura', label:'¿Existe estructura de procesos?', opts:OPTS},\n        {key:'continuidad', label:'¿Utiliza las variables de continuidad?', opts:OPTS},\n        {key:'modelo', label:'¿Cuenta con un modelo de calificación?', opts:[{label:'Directa',v:1},{label:'Variables',v:3},{label:'Mixta',v:5},{label:'N/A',v:'NA'}]}\n      ]},\n      {key:'riesgos', label:'Riesgos', questions:[\n        {key:'asociaciones', label:'¿Tiene asociaciones?', opts:OPTS},\n        {key:'evaluacion', label:'¿El riesgo tiene una evaluación asignada?', opts:OPTS},\n        {key:'caucon', label:'¿Utiliza cau-con o amenazas y vulnerabilidades en su metodología?', opts:OPTS}\n      ]},\n      {key:'causas', label:'Causas', questions:[\n        {key:'asociaciones', label:'¿Tiene asociaciones?', opts:OPTS}\n      ]},\n      {key:'controles', label:'Controles', questions:[\n        {key:'mitigacion', label:'¿Usa la barra de mitigación?', opts:OPTS},\n        {key:'triangula', label:'¿Triangula el Riesgo-Causa-Control?', opts:OPTS},\n        {key:'evaluacion', label:'¿El control tiene asignada una evaluación?', opts:OPTS}\n      ]},\n      {key:'eventos', label:'Eventos', questions:[\n        {key:'formulario', label:'¿Usa el formulario externo para el reporte de eventos?', opts:OPTS},\n        {key:'flujo', label:'¿Tiene un flujo de gestión de eventos?', opts:OPTS}\n      ]},\n      {key:'planes', label:'Planes de Acción', questions:[\n        {key:'alertas', label:'¿Ha personalizado alertas para dar seguimiento a los planes?', opts:OPTS},\n        {key:'flujo', label:'¿Tiene un flujo de gestión de planes de acción?', opts:OPTS}\n      ]},\n      {key:'reportes', label:'Reportes', questions:[\n        {key:'compartidos', label:'¿Ha compartido los reportes dinámicos?', opts:OPTS},\n        {key:'estructurados', label:'¿Tiene estructurados reportes dinámicos?', opts:OPTS}\n      ]},\n      {key:'indicadores', label:'Indicadores', questions:[\n        {key:'kri', label:'¿Tiene estructurados indicadores KRI-KCI-KPI?', opts:OPTS},\n        {key:'automaticos', label:'¿Ha usado indicadores automáticos?', opts:OPTS}\n      ]},\n      {key:'evaluacionMod', label:'Evaluación', questions:[\n        {key:'planriesgos', label:'¿Ha definido un plan de evaluación para riesgos?', opts:OPTS},\n        {key:'plancontroles', label:'¿Ha definido un plan de evaluaciones para los controles?', opts:OPTS}\n      ]},\n      {key:'integraciones', label:'Integraciones', questions:[\n        {key:'analitica', label:'¿Se ha integrado con plataforma de analítica?', opts:OPTS},\n        {key:'directorio', label:'¿Está integrado con directorio activo?', opts:OPTS}\n      ]},\n      {key:'activos', label:'Activos (ISMS)', questions:[\n        {key:'estructura', label:'¿Tiene una estructura de activos de información?', opts:OPTS}\n      ]},\n      {key:'factores', label:'Factores de Riesgos (AML)', questions:[\n        {key:'usa', label:'¿Utiliza los factores de riesgos para la medición de sus riesgos?', opts:OPTS}\n      ]}\n    ];\n    this.culturaModules = [\n      {key:'liderazgo', label:'Liderazgo y ejemplo', questions:[\n        {key:'comunica', label:'La alta dirección habla con frecuencia sobre riesgos en sus comunicaciones internas (reuniones, correos, comités).', opts:OPTS},\n        {key:'decisiones', label:'Los líderes toman decisiones considerando explícitamente los riesgos, no solo los resultados financieros.', opts:OPTS},\n        {key:'escuchado', label:'Cuando un colaborador reporta un riesgo o un incidente, siente que será escuchado y no castigado.', opts:OPTS},\n        {key:'agenda', label:'La gestión de riesgos aparece como tema recurrente en la agenda de la junta directiva o el comité ejecutivo.', opts:OPTS},\n        {key:'ejemplo', label:'Los líderes predican con el ejemplo: cumplen ellos mismos las políticas y controles que piden al resto del equipo.', opts:OPTS}\n      ]},\n      {key:'organizacion', label:'Cómo estamos organizados', questions:[\n        {key:'responsable', label:'Tenemos claramente definido quién es el responsable de la gestión de riesgos en la organización.', opts:OPTS},\n        {key:'roles', label:'Existen roles y responsabilidades claras para la gestión de riesgos en cada área o proceso del negocio.', opts:OPTS},\n        {key:'lineas', label:'Nuestra estructura sigue el modelo de las tres líneas de defensa (operaciones, riesgos/cumplimiento, auditoría) o una similar.', opts:OPTS},\n        {key:'independencia', label:'La función de riesgos tiene independencia y acceso directo a la alta dirección cuando lo necesita.', opts:OPTS},\n        {key:'politicas', label:'Contamos con políticas escritas, aprobadas y vigentes para la gestión de riesgos.', opts:OPTS}\n      ]},\n      {key:'metodologia', label:'Nuestra forma de trabajar los riesgos', questions:[\n        {key:'metodo', label:'Tenemos una metodología definida para identificar, analizar, evaluar y tratar los riesgos.', opts:OPTS},\n        {key:'periodica', label:'Los riesgos se identifican de manera periódica y no solo cuando algo sale mal.', opts:OPTS},\n        {key:'documenta', label:'Documentamos los riesgos y sus controles en matrices o registros que se mantienen actualizados.', opts:OPTS},\n        {key:'efectividad', label:'Medimos qué tan efectivos son nuestros controles (no solo si existen en el papel).', opts:OPTS},\n        {key:'causaraiz', label:'Cuando ocurre un incidente, hacemos análisis de causa raíz y ajustamos controles para que no vuelva a pasar.', opts:OPTS}\n      ]},\n      {key:'equipo', label:'Qué tanto sabe y puede el equipo', questions:[\n        {key:'entiende', label:'La mayoría de los colaboradores entiende qué es un riesgo y por qué es importante gestionarlo. ['GQ','Guinea Ecuatorial','🇬🇶'],['UY','Uruguay','🇺🇾'],['AR','Argentina','🇦🇷'],\n      ['VE','Venezuela','🇻🇪'],['CM','Camerún','🇨🇲'],['GH','Ghana','🇬🇭'],['CA','Canadá','🇨🇦']\n    ];\n    this.quadDefs = [\n      {key:'aliados', label:'Aliados estratégicos', desc:'Alto uso · alta cultura', color:'#15A795', bg:'#E2F3EF'},\n      {key:'subutilizado', label:'Potencial sin explotar', desc:'Bajo uso · alta cultura', color:'#E0A22B', bg:'#FBF1DA'},\n      {key:'operativo', label:'Operan sin gobierno', desc:'Alto uso · baja cultura', color:'#E07B4F', bg:'#FBE6DA'},\n      {key:'riesgo', label:'En riesgo / churn', desc:'Bajo uso · baja cultura', color:'#E0605E', bg:'#FAE0DF'}\n    ];\n    var DEFAULT_SYNC_URL='https://script.google.com/a/macros/pirani.co/s/AKfycbwacJZjocopHIY9hLA-ueETN4t6lHV5IdVnpSAtfxrJzBuVJM-Ddu6YAHudZdfEwc8k/exec';\n    var ro=false, url='', tk='';\n    try{ ro=new URLSearchParams(location.search).get('modo')==='consulta'; }catch(e){}\n    try{ if(window.__PIRANI_RO__===true) ro=true; }catch(e){}   // modo consulta inyectado por Apps Script\n    try{ url=localStorage.getItem('pirani_sync_url')||''; }catch(e){}\n    try{ tk=localStorage.getItem('pirani_team_key')||''; }catch(e){}\n    // Si el entorno se sirve DENTRO de Apps Script, usa la URL que el propio servidor inyectó.\n    try{ if(window.__PIRANI_URL__) url=window.__PIRANI_URL__; }catch(e){}\n    if(!url) url=DEFAULT_SYNC_URL;   // se conecta solo; el ⚙ permite cambiarla\n    this.state = { view:'mapa', heatMode:'cuadrantes', panelOpen:true, gran:'sistema', fTerr:'Todos los territorios', fSist:'Todos los sistemas', fPlan:'Todos los planes', evals:this._load(), draft:null, draftStep:'datos', hoverId:null, detail:null,\n      readOnly:ro, syncUrl:url, syncStatus:url?'loading':'off', syncMsg:'', showSettings:false, urlDraft:url, pushing:false, teamKey:tk, keyDraft:tk };\n  }\n\n  componentDidMount(){ if(this.state.syncUrl) this._syncFetch(); }\n\n  // ---- serialización entre evaluación y fila de Sheets
